[project]
name = "node-stats-mcp"
version = "0.1.0"
description = "Node-local MCP battery: host CPU/memory/disk/load/network/process introspection over streamable-HTTP."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Kai Siren" }]
dependencies = [
  "mcp>=1.14.0",
  "psutil>=6.0.0",
]

[project.scripts]
node-stats-mcp = "node_stats_mcp.__main__:main"

[tool.uv]
managed = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/node_stats_mcp"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "RUF"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "node_stats_mcp.server"
# FastMCP's tool() decorator is untyped; registering through it trips
# no-untyped-call under strict mode. The tool bodies themselves stay typed.
disable_error_code = ["no-untyped-call"]

[dependency-groups]
dev = [
  "mypy>=1.20.0",
  "pre-commit>=4.5.1",
  "ruff>=0.15.10",
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Per-repo opt-outs for agentic-os pre-commit hooks (agentic_os/config.py).

[tool.agentic-os.repo-pointer-skills]
# This repo lives under the coilyco-flight-deck org dir.
org = "coilyco-flight-deck"

[tool.agentic-os.issue-reference-guard]
enabled = true
