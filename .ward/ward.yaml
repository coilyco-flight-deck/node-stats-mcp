# Per-repo command allowlist for node-stats-mcp (the `ward` gate).
#
# `ward lint` enforces: each command's `run` equals `make <verb>`, the Makefile
# declares that target, and the description equals the target's `## desc`.
#
# Deploy verbs are deliberately absent - the deploy surface lives in
# coilyco-bridge/deploy/services/node-stats-mcp per the layer invariant
# (source -> deploy).

commands:
  sync:
    run: make sync
    description: uv lock + uv sync with dev deps.
  test:
    run: make test
    description: Run the pytest suite.
  lint:
    run: make lint
    description: ruff check + ruff format --check + mypy on src/ and tests/.
  fmt:
    run: make fmt
    description: Apply ruff fixes and formatting in place.
  precommit:
    run: make precommit
    description: Run all pre-commit hooks against every file.
  build-docker:
    run: make build-docker
    description: Build the node-stats-mcp docker image locally.
  run:
    run: make run
    description: Run the MCP server locally over streamable-HTTP on :8080.

catalog:
  kind: Component
  type: service
  system: infrastructure
  owner: kai
  lifecycle: production
  description: "Node-local MCP battery: reads node health plus k3s pod, process, memory, and local-volume attribution over streamable-HTTP. Deployed as a hostPID+hostNetwork pod pinned to one node; deploy surface lives in coilyco-bridge/deploy."
  dependsOn: []
  providesApis:
    - node-stats-mcp
